# Default values for stripo-video-processing-service.

replicaCount: 1

# ffmpeg jobs can run up to ~5 min on shutdown (video.processing.shutdownAwaitSec).
# progressDeadlineSeconds must stay above terminationGracePeriodSeconds or
# helm/kubectl rollout status fails while the old pod is still draining.
DeadlineSeconds: 600
terminationGracePeriodSeconds: 360

image:
  repository: stripo/stripo-video-processing-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: dockerhub

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

serviceMonitor:
  enabled: false

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 10

startupProbe:
  initialDelaySeconds: 9
  periodSeconds: 1
  failureThreshold: 180

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

httproute:
  enabled: false
  pathPrefix: /
  hostnames: []
  gateway:
    name: ngf-public
    namespace: nginx-gateway

resources:
  limits:
    memory: 1300Mi
    cpu: 1000m
  requests:
    memory: 750Mi
    cpu: 100m

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

env:
  - name: JAVA_TOOL_OPTIONS
    value: -Xss256k -Xms128m -Xmx512m -XX:ReservedCodeCacheSize=128M -Djava.net.preferIPv4Stack=true

settings:
  profile: PLUGINS

configmap:
  enabled: true
  extraScrapeConfigs:
    # Defaults for self-hosted (enterprise) installations. Loaded via
    # SPRING_CONFIG_NAME=base,application — keys in the client-provided
    # application.properties override these. Without this ConfigMap the JAR
    # default is service.mode=account.
    base.properties: |
      service.mode=plugin

dumpCollectorEnable: false

pdb:
  enabled: false
