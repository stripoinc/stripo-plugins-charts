apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "application.fullname" . }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  progressDeadlineSeconds: {{ .Values.DeadlineSeconds }}  
  selector:
    matchLabels:
      {{- include "application.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "application.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "application.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: APPNAME
              value: {{ .Values.nameOverride }}
            - name: ENV
              value: {{ .Values.settings.profile }}
            - name: PROFILE
              value: {{ .Values.settings.profile }}
            - name: DOCKER_HOST
              value: {{ .Values.settings.profile }}
            {{- if .Values.settings.golang.goMaxProcs }}
            - name: GOMAXPROCS
              value: "{{ .Values.settings.golang.goMaxProcs }}"
            {{- end }}
            {{- if .Values.settings.golang.goMemLimit }}
            - name: GOMEMLIMIT
              value: "{{ .Values.settings.golang.goMemLimit }}"
            {{- end }}
            {{- if .Values.settings.golang.goGc }}
            - name: GOGC
              value: "{{ .Values.settings.golang.goGc }}"
            {{- end }}
            {{- if .Values.settings.cockroachDb }}
            - name: COCKROACH_CONNECTION_STRING
              value: "postgresql://{{ .Values.settings.cockroachDb.username }}:{{ .Values.settings.cockroachDb.password }}@{{ .Values.settings.cockroachDb.host }}:{{ .Values.settings.cockroachDb.port }}/%s"
            - name: COCKROACH_DB
              value: {{ .Values.settings.cockroachDb.databaseName }}
            {{- end }}
            {{- /*
              settings.dbType is the single switch selecting the active storage backend.
              Valid values: "TiDB" (default when unset) or "AuroraMySQL". Only the connection
              env vars for the active backend are rendered below, and the service level
              DB_READ_TARGET / DB_WRITE_TARGETS are derived from the same value.
            */}}
            {{- if eq .Values.settings.dbType "AuroraMySQL" }}
            {{- if .Values.settings.auroraMysql }}
            - name: AURORA_MYSQL_HOST
              value: {{ .Values.settings.auroraMysql.host }}
            - name: AURORA_MYSQL_PORT
              value: "{{ .Values.settings.auroraMysql.port | default 3306 }}"
            - name: AURORA_MYSQL_USER
              value: {{ .Values.settings.auroraMysql.username }}
            - name: AURORA_MYSQL_PASSWORD
              value: {{ .Values.settings.auroraMysql.password }}
            - name: AURORA_MYSQL_DATABASE
              value: {{ .Values.settings.auroraMysql.databaseName }}
              {{- /* kindIs check, not truthiness: 0 is a valid connection count */}}
              {{- if not (kindIs "invalid" .Values.settings.auroraMysql.openConnections) }}
            - name: AURORA_MYSQL_OPEN_CONNECTIONS
              value: "{{ .Values.settings.auroraMysql.openConnections }}"
              {{- end }}
              {{- if not (kindIs "invalid" .Values.settings.auroraMysql.idleConnections) }}
            - name: AURORA_MYSQL_IDLE_CONNECTIONS
              value: "{{ .Values.settings.auroraMysql.idleConnections }}"
              {{- end }}
              {{- if .Values.settings.auroraMysql.connMaxLifetime }}
            - name: AURORA_MYSQL_CONN_MAX_LIFETIME
              value: {{ .Values.settings.auroraMysql.connMaxLifetime }}
              {{- end }}
              {{- if .Values.settings.auroraMysql.reconnectInterval }}
            - name: AURORA_MYSQL_RECONNECT_INTERVAL
              value: {{ .Values.settings.auroraMysql.reconnectInterval }}
              {{- end }}
              {{- if .Values.settings.auroraMysql.connectTimeout }}
            - name: AURORA_MYSQL_CONNECT_TO_DATABASE_TIMEOUT
              value: {{ .Values.settings.auroraMysql.connectTimeout }}
              {{- end }}
              {{- if .Values.settings.auroraMysql.tls }}
            - name: AURORA_MYSQL_TLS_MODE
              value: {{ .Values.settings.auroraMysql.tls.mode | default "verify_identity" }}
            - name: AURORA_MYSQL_TLS_CA_FILE
              value: "/etc/ssl/rds/{{ .Values.settings.auroraMysql.tls.caBundleKey | default "global-bundle.pem" }}"
            - name: AURORA_MYSQL_TLS_SERVER_NAME
              value: {{ .Values.settings.auroraMysql.tls.serverName | default .Values.settings.auroraMysql.host }}
              {{- end }}
            {{- end }}
            {{- else if .Values.settings.tiDb }}
            - name: TIDB_HOST
              value: {{ .Values.settings.tiDb.host }}
            - name: TIDB_PORT
              value: "{{ .Values.settings.tiDb.port }}"
            - name: TIDB_USER
              value: {{ .Values.settings.tiDb.username }}
            - name: TIDB_PASSWORD
              value: {{ .Values.settings.tiDb.password }}
            - name: TIDB_DATABASE
              value: {{ .Values.settings.tiDb.databaseName }}
            {{- end }}
            {{- if .Values.settings.dbType }}
            - name: DB_READ_TARGET
              value: "{{ .Values.settings.dbType }}"
            - name: DB_WRITE_TARGETS
              value: "{{ .Values.settings.dbType }}"
            {{- end }}
            {{- if .Values.settings.dbMigration }}
              {{- /* kindIs check, not truthiness: false is a valid explicit value */}}
              {{- if not (kindIs "invalid" .Values.settings.dbMigration.enabled) }}
            - name: DB_MIGRATION_ENABLED
              value: "{{ .Values.settings.dbMigration.enabled }}"
              {{- end }}
              {{- if not (kindIs "invalid" .Values.settings.dbMigration.missingDataEnabled) }}
            - name: DB_MISSING_DATA_MIGRATION_ENABLED
              value: "{{ .Values.settings.dbMigration.missingDataEnabled }}"
              {{- end }}
            {{- end }}
            {{- if .Values.settings.nats }}
            - name: NATS_URL
              value: "{{ .Values.settings.nats.url }}"
            - name: NATS_USER
              value: {{ .Values.settings.nats.user }}
            - name: NATS_PASSWORD
              value: {{ .Values.settings.nats.password }}
            {{- end }}
            {{- if and .Values.settings.redis .Values.settings.redis.clusterUrl }}
            - name: REDIS_ADDRESS
              value: {{ .Values.settings.redis.clusterUrl }}
            {{- end }}
            {{- if and .Values.settings.redis .Values.settings.redis.host }}
            - name: REDIS_HOST
              value: {{ .Values.settings.redis.host }}
            - name: REDIS_PORT
              value: "{{ .Values.settings.redis.port }}"
            - name: REDIS_PASSWORD
              value: {{ .Values.settings.redis.password }}
            {{- end }}
            {{- if .Values.settings.logstash }}
            - name: LOGSTASH_HOST
              value: {{ .Values.settings.logstash.host }}
            - name: LOGSTASH_PORT
              value: "{{ .Values.settings.logstash.port }}"
            {{- end }}
            {{- if and .Values.settings.auth .Values.settings.auth.jwt }}
            - name: PLUGIN_AUTH_JWT_SECRET_KEY
              value: {{ .Values.settings.auth.jwt.secret }}
            {{- end }}
            {{- if and .Values.settings.auth .Values.settings.auth.base64 .Values.settings.auth.base64.htmlCssV1Request }}
            - name: DIRTY_MODEL_PRIVATE_ENDPOINT_USERNAME
              value: {{ .Values.settings.auth.base64.htmlCssV1Request.username }}
            - name: DIRTY_MODEL_PRIVATE_ENDPOINT_PASSWORD
              value: {{ .Values.settings.auth.base64.htmlCssV1Request.password }}
            {{- end }}
            {{- if .Values.settings.accessControlAllowOrigin }}
            - name: HTTP_CORS_ALLOWED_ORIGINS
              value: "{{ .Values.settings.accessControlAllowOrigin }}"
            {{- end }}
            {{- if .Values.settings.changedEmailNotificationDebounceTime }}
            - name: CHANGED_EMAIL_NOTIFICATION_SEND_DEBOUNCE_TIME
              value: {{ .Values.settings.changedEmailNotificationDebounceTime }}
            {{- end }}
            {{- if .Values.settings.rateLimits }}
            - name: RATE_LIMITER_WEBSOCKET_MSGS_DEFAULT_JSON_CONFIG
              value: '{{ .Values.settings.rateLimits.ws.defaultMessage }}'
            - name: RATE_LIMITER_WEBSOCKET_MSGS_CURSOR_JSON_CONFIG
              value: '{{ .Values.settings.rateLimits.ws.cursorMessage }}'
            - name: RATE_LIMITER_HTTP_JSON_CONFIG_DEFAULT
              value: '{{ .Values.settings.rateLimits.rest.defaultRequest }}'
            - name: RATE_LIMITER_HTTP_JSON_CONFIG
              value: '{"EmailModelCompilationV1":{{ .Values.settings.rateLimits.rest.compileRequest }}, "EmailModelHtmlCssV1":{{ .Values.settings.rateLimits.rest.htmlCssV1Request }} }'
            {{- end }}
            {{- if .Values.env }}
            {{- toYaml .Values.env | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 7071
              protocol: TCP
            - name: prometheus
              containerPort: 9145
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livenessProbe
              port: 9145
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            successThreshold: 1
            timeoutSeconds: 2
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /readinessProbe
              port: 9145
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            successThreshold: 1
            timeoutSeconds: 1
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.startupProbe }}
          startupProbe:
            httpGet:
              path: /readinessProbe
              port: 9145
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            successThreshold: 1
            timeoutSeconds: 2
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $auroraCaBundle := and (eq .Values.settings.dbType "AuroraMySQL") .Values.settings.auroraMysql .Values.settings.auroraMysql.tls .Values.settings.auroraMysql.tls.caBundleConfigMap }}
          {{- if or .Values.configmap.enabled $auroraCaBundle }}
          volumeMounts:
            {{- if .Values.configmap.enabled }}
            - name: properties
              mountPath: /usr/src/app/config/
            {{- end }}
            {{- if $auroraCaBundle }}
            - name: rds-ca
              mountPath: /etc/ssl/rds
              readOnly: true
            {{- end }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.configmap.enabled $auroraCaBundle }}
      volumes:
        {{- if .Values.configmap.enabled }}
        - name: properties
          configMap:
            name: {{ .Values.fullnameOverride }}
        {{- end }}
        {{- if $auroraCaBundle }}
        - name: rds-ca
          configMap:
            name: {{ .Values.settings.auroraMysql.tls.caBundleConfigMap }}
        {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
